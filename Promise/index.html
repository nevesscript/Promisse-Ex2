<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Pedidos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <header>
            <h1>Meu Pedido</h1>
            <p>Simulador de processamento de pedidos</p>
        </header>

        <section class="produto">

            <div class="imagem">
                <img src="icons8-hambúrguer-50.png" alt="Hambúrguer">
            </div>

            <div id="informacoes">
                <h2>X-Burguer</h2>
                <p>Hambúrguer, queijo, alface e tomate.</p>
                <span>R$ 25,00</span>
            </div>

        </section>

        <section class="pedido">

            <h3>Status do pedido</h3>

            <div id="status">
                Aguardando pedido...
            </div>

            <button id="btnPedido">
                Fazer pedido
            </button>

        </section>

        <footer>
            <p>Projeto desenvolvido para praticar JavaScript</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
